<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <clipPath id="round">
      <rect x="20" y="20" width="560" height="560" rx="56" ry="56"/>
    </clipPath>
  </defs>

  <!-- die-cut border -->
  <rect x="8" y="8" width="584" height="584" rx="68" ry="68" fill="#ffffff"/>

  <g clip-path="url(#round)">
    <!-- background -->
    <rect x="20" y="20" width="560" height="560" fill="#0d1117"/>

    <!-- accent corner glow -->
    <circle cx="520" cy="80" r="220" fill="#1f6feb" opacity="0.18"/>
    <circle cx="90" cy="540" r="200" fill="#f78166" opacity="0.12"/>

    <!-- terminal prompt mark -->
    <text x="300" y="118" text-anchor="middle" font-size="60" font-weight="700" fill="#3fb950" font-family="'SFMono-Regular', Menlo, Consolas, monospace">claude&gt;_</text>

    <!-- main slogan -->
    <text x="300" y="245" text-anchor="middle" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">Don't use it</text>
    <text x="300" y="312" text-anchor="middle" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">if you don't</text>
    <text x="300" y="379" text-anchor="middle" font-size="56" font-weight="800" fill="#f78166" letter-spacing="-1">get it.</text>

    <!-- divider -->
    <rect x="200" y="420" width="200" height="3" rx="1.5" fill="#30363d"/>

    <!-- subtext, smaller caps -->
    <text x="300" y="470" text-anchor="middle" font-size="20" font-weight="700" fill="#c9d1d9" letter-spacing="2" style="font-variant: small-caps;">You're responsible.</text>
    <text x="300" y="500" text-anchor="middle" font-size="16" font-weight="500" fill="#8b949e" letter-spacing="1.5" style="font-variant: small-caps;">Understand what the AI did</text>
    <text x="300" y="524" text-anchor="middle" font-size="16" font-weight="500" fill="#8b949e" letter-spacing="1.5" style="font-variant: small-caps;">before committing.</text>

    <!-- footer tag -->
    <text x="300" y="560" text-anchor="middle" font-size="13" font-weight="600" fill="#3fb950" letter-spacing="3" font-family="'SFMono-Regular', Menlo, Consolas, monospace">CRAFT &gt; AUTOPILOT</text>
  </g>
</svg>
